<html>
<style>
input{
   font-size:20px;
   width:320px;
}
</style>
<body>
<form action="saveRecord" method="post">
<table style="border:2px solid silver; margin:auto; font-size:20px" cellpadding="10">
<tr>
<td>Enter product Id</td>
<td><input type="text" name="pid" required="required"></td>
</tr>
<tr>
<td>Enter product name</td>
<td><input type="text" name="name" required="required"></td>
</tr>
<tr>
<td>Enter product brand</td>
<td><input type="text" name="brand" required="required"></td>
</tr>
<tr>
<td>Enter product price</td>
<td><input type="text" name="price" required="required"></td>
</tr>
<tr>
<td colspan="2" align="right">
<button style="font-size: 20px">Save Record</button>
</td>
</tr>

</table>
</form>
</body>
</html>
